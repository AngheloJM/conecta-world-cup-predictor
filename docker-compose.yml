services:
  db:
    image: postgres:16-alpine
    container_name: conecta_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-conecta}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - conecta_pgdata:/var/lib/postgresql/data
      # Se ejecuta SOLO en la primera inicialización (volumen vacío).
      - ./backend/migrations/0001_init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-conecta}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  conecta_pgdata:
